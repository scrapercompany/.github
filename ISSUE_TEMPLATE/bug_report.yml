name: Bug report
description: Something in this repository does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste an API key. For security issues email security@scrapercompany.com instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or request. Include the `request_id` from the response if there was one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Library version, language/runtime version and OS.
